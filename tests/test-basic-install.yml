name: Test basic minikube install (no start)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          start: 'false'
          cache: 'false'
        continue-on-error: true
      - name: Assert action outcome and minikube binary
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded, checking minikube binary..."
            if ! command -v minikube >/dev/null 2>&1; then
              # Try the default install path
              MINIKUBE_BIN="$HOME/bin/minikube"
              if [ ! -f "$MINIKUBE_BIN" ]; then
                echo "FAIL: minikube binary not found in PATH or at $MINIKUBE_BIN"
                exit 1
              fi
              echo "PASS: minikube found at $MINIKUBE_BIN"
              VERSION_OUTPUT=$("$MINIKUBE_BIN" version 2>&1)
            else
              echo "PASS: minikube found at $(command -v minikube)"
              VERSION_OUTPUT=$(minikube version 2>&1)
            fi
            echo "Version output: $VERSION_OUTPUT"
            if ! echo "$VERSION_OUTPUT" | grep -q "minikube version"; then
              echo "FAIL: minikube version output unexpected: $VERSION_OUTPUT"
              exit 1
            fi
            echo "PASS: minikube version output looks correct"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (download may not be available in this environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
